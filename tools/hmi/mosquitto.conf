# Project broker for the FZ3B node and the host HMI (tools/hmi).
# Listens only on this Mac (localhost) and the board link (en8, 192.168.1.253);
# anonymous is fine there, nothing else can reach it.
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

listener 1883 127.0.0.1
listener 1883 192.168.1.253
